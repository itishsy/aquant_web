<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>交易信号系统 | 设置</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 使用系统默认字体 -->
    <link rel="stylesheet" href="{{ url_for('main.style_css') }}">
    <style>
        /* 设置页面特定样式 */
        .setting-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f5f5f7;
        }
        
        .setting-content.show {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #1d1d1f;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e2e7;
            border-radius: 12px;
            font-size: 16px;
            background-color: #f5f5f7;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0071e3;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }
        
        .submit-btn:hover {
            background-color: #0063cc;
            transform: translateY(-1px);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        /* 确保设置项正确显示 */
        .setting-item {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        
        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
        }
        
        .setting-title {
            font-weight: 600;
            font-size: 18px;
            color: #1d1d1f;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/index'" style="cursor: pointer; text-align: center; width: 100%; position: absolute; left: 0; font-size: 24px; color: #1e3a8a; font-weight: bold;">模式设置</div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </nav>
    
    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 设置界面 -->
        <div class="screen-container active" id="settingsScreen">
            <div class="welcome-section">
                <h1>交易设置</h1>
                <p>配置您的交易模式和规则</p>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-title">自动交易模式</div>
                    <label class="setting-toggle">
                        <input type="checkbox" id="autoTradeToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-content" id="autoTradeSettings">
                    <div class="form-group">
                        <label for="riskPercentage">风险百分比</label>
                        <input type="number" id="riskPercentage" step="0.1" min="0.1" max="10" value="2.0">
                    </div>
                    <div class="form-group">
                        <label for="maxPositions">最大持仓数量</label>
                        <input type="number" id="maxPositions" step="1" min="1" max="20" value="5">
                    </div>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-title">技术指标设置</div>
                    <label class="setting-toggle">
                        <input type="checkbox" id="indicatorsToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-content" id="indicatorsSettings">
                    <div class="form-group">
                        <label for="rsiPeriod">RSI周期</label>
                        <input type="number" id="rsiPeriod" step="1" min="5" max="20" value="14">
                    </div>
                    <div class="form-group">
                        <label for="macdFast">MACD快线周期</label>
                        <input type="number" id="macdFast" step="1" min="5" max="20" value="12">
                    </div>
                    <div class="form-group">
                        <label for="macdSlow">MACD慢线周期</label>
                        <input type="number" id="macdSlow" step="1" min="10" max="30" value="26">
                    </div>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-header">
                    <div class="setting-title">通知设置</div>
                    <label class="setting-toggle">
                        <input type="checkbox" id="notificationsToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-content" id="notificationsSettings">
                    <div class="form-group">
                        <label for="notificationType">通知类型</label>
                        <select id="notificationType">
                            <option value="all">所有信号</option>
                            <option value="highConfidence">高置信度信号</option>
                            <option value="onlyProfit">仅盈利通知</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="submit-btn" style="margin-top:20px;" id="saveSettingsBtn">保存设置</button>
        </div>
    </main>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='/choice'">
            <div class="nav-icon"><i class="fas fa-star"></i></div>
            <div class="nav-label">自选</div>
        </div>
        <div class="nav-item" onclick="window.location.href='/market'">
            <div class="nav-icon"><i class="fas fa-chart-area"></i></div>
            <div class="nav-label">市场</div>
        </div>
        <div class="nav-item" onclick="window.location.href='/review'">
            <div class="nav-icon"><i class="fas fa-book-open"></i></div>
            <div class="nav-label">复盘</div>
        </div>
        <div class="nav-item active" onclick="window.location.href='/setting'">
            <div class="nav-icon"><i class="fas fa-cog"></i></div>
            <div class="nav-label">设置</div>
        </div>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function() {
            // 初始化设置项展开/收起功能
            initSettingToggles();
            
            // 初始化保存按钮
            initSaveButton();
        });
        
        function initSettingToggles() {
            // 获取所有开关
            const toggles = document.querySelectorAll('.setting-toggle input[type="checkbox"]');
            
            toggles.forEach(toggle => {
                // 初始状态：根据checked属性显示/隐藏内容
                const settingContent = toggle.closest('.setting-item').querySelector('.setting-content');
                if (toggle.checked) {
                    settingContent.classList.add('show');
                }
                
                // 添加点击事件
                toggle.addEventListener('change', function() {
                    if (this.checked) {
                        settingContent.classList.add('show');
                    } else {
                        settingContent.classList.remove('show');
                    }
                });
            });
        }
        
        function initSaveButton() {
            const saveBtn = document.getElementById('saveSettingsBtn');
            if (saveBtn) {
                saveBtn.addEventListener('click', function() {
                    // 收集所有设置值
                    const settings = {
                        autoTrade: {
                            enabled: document.getElementById('autoTradeToggle').checked,
                            riskPercentage: document.getElementById('riskPercentage').value,
                            maxPositions: document.getElementById('maxPositions').value
                        },
                        indicators: {
                            enabled: document.getElementById('indicatorsToggle').checked,
                            rsiPeriod: document.getElementById('rsiPeriod').value,
                            macdFast: document.getElementById('macdFast').value,
                            macdSlow: document.getElementById('macdSlow').value
                        },
                        notifications: {
                            enabled: document.getElementById('notificationsToggle').checked,
                            type: document.getElementById('notificationType').value
                        }
                    };
                    
                    // 显示保存成功提示
                    showSaveSuccess();
                    
                    // 这里可以添加保存到服务器的逻辑
                    console.log('保存设置:', settings);
                });
            }
        }
        
        function showSaveSuccess() {
            const saveBtn = document.getElementById('saveSettingsBtn');
            const originalText = saveBtn.textContent;
            
            saveBtn.textContent = '保存成功！';
            saveBtn.style.backgroundColor = '#34c759';
            
            setTimeout(() => {
                saveBtn.textContent = originalText;
                saveBtn.style.backgroundColor = '#0071e3';
            }, 2000);
        }
    </script>
</body>
</html>
