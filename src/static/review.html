<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>复盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('main.style_css') }}">
    <style>
        .review-shell { display: flex; flex-direction: column; gap: 14px; }
        .module-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .module-tab { border: none; border-radius: 16px; padding: 12px 8px; background: #eef3f9; color: #4b5b72; font-size: 13px; font-weight: 700; }
        .module-tab.active { background: linear-gradient(135deg, #0f62fe 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 10px 24px rgba(15,98,254,.2); }
        .module-panel { display: none; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
        .module-panel.active { display: block; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
        .panel-head h2 { font-size: 18px; color: #162033; }
        .panel-desc { font-size: 12px; color: #6b7a90; line-height: 1.6; margin-top: 4px; }
        .new-btn, .ghost-btn, .danger-btn, .primary-btn { border: none; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; }
        .new-btn { background: #eff6ff; color: #1d4ed8; }
        .ghost-btn { background: #eef3f9; color: #415168; }
        .danger-btn { background: #fff1f2; color: #e11d48; }
        .primary-btn { background: linear-gradient(135deg, #0f62fe 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 10px 22px rgba(15,98,254,.18); }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 16px; background: #f8fafc; border: 1px solid #edf2f7; }
        .history-main { min-width: 0; }
        .history-title { font-size: 14px; font-weight: 800; color: #172435; margin-bottom: 4px; }
        .history-sub { font-size: 12px; color: #6b7a90; line-height: 1.6; }
        .history-link { border: none; background: none; color: #0f62fe; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .empty-text { color: #6b7a90; font-size: 13px; text-align: center; padding: 18px 0 6px; }
        .editor { display: none; margin-top: 14px; border-top: 1px dashed #e5eaf2; padding-top: 14px; }
        .editor.show { display: block; }
        .editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
        .editor-title { font-size: 14px; font-weight: 800; color: #1f2a3c; }
        .form-grid { display: grid; gap: 14px; }
        .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #21314b; }
        .field input, .field textarea, .field select { width: 100%; border: 1px solid #dbe4ef; border-radius: 14px; background: #f8fafc; padding: 12px 14px; font-size: 14px; color: #1f2937; }
        .field textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
        .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #0f62fe; box-shadow: 0 0 0 3px rgba(15,98,254,.1); background: #fff; }
        .section-title { margin: 18px 0 10px; font-size: 14px; font-weight: 800; color: #162033; display: flex; align-items: center; justify-content: space-between; }
        .action-list { display: flex; flex-direction: column; gap: 10px; }
        .action-item { padding: 12px; border: 1px solid #e8eef5; border-radius: 18px; background: #fbfdff; }
        .action-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .item-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
        .panel-actions { display: flex; gap: 10px; margin-top: 16px; }
        .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); min-width: 180px; max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 14px; background: rgba(15,23,42,.92); color: #fff; text-align: center; font-size: 13px; z-index: 1200; }
        @media (max-width: 480px) { .form-grid.two, .action-grid { grid-template-columns: 1fr; } .panel-actions { flex-direction: column; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/aquant_web/index'" style="cursor: pointer; text-align: center; width: 100%; position: absolute; left: 0; font-size: 24px; color: #1e3a8a; font-weight: bold;">复盘</div>
        <div class="user-info"><div class="user-avatar" id="userAvatar">U</div></div>
    </nav>

    <main class="main-content">
        <div class="review-shell">
            <section class="module-tabs">
                <button class="module-tab active" data-tab="dailyPanel">每日计划</button>
                <button class="module-tab" data-tab="weeklyPanel">周复盘</button>
                <button class="module-tab" data-tab="monthlyPanel">月总结</button>
            </section>

            <section class="module-panel active" id="dailyPanel">
                <div class="panel-head">
                    <div>
                        <h2>每日计划</h2>
                        <div class="panel-desc">默认显示历史记录，点击新建计划后进入编辑。</div>
                    </div>
                    <button class="new-btn" type="button" id="newDailyBtn">新建计划</button>
                </div>
                <div class="history-list" id="dailyHistory"></div>
                <div class="editor" id="dailyEditor">
                    <div class="editor-bar">
                        <div class="editor-title">每日计划编辑</div>
                        <button class="ghost-btn" type="button" id="cancelDailyBtn">返回历史</button>
                    </div>
                    <div class="form-grid two">
                        <div class="field">
                            <label for="dailyDate">交易日期</label>
                            <input type="date" id="dailyDate">
                        </div>
                        <div class="field">
                            <label for="positionPct">当日仓位</label>
                            <select id="positionPct">
                                <option value="">请选择</option>
                                <option value="空仓">空仓</option>
                                <option value="3-4成仓">3-4成仓</option>
                                <option value="5成仓">5成仓</option>
                                <option value="6-7成仓">6-7成仓</option>
                                <option value="8-9成仓">8-9成仓</option>
                                <option value="满仓">满仓</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="field"><label for="operationSummary">操作小结</label><textarea id="operationSummary"></textarea></div>
                        <div class="field"><label for="tomorrowPlan">明日计划</label><textarea id="tomorrowPlan"></textarea></div>
                        <div class="field"><label for="riskWatch">风险提醒（可选）</label><textarea id="riskWatch"></textarea></div>
                    </div>
                    <div class="section-title">
                        <span>今日操作</span>
                        <button class="ghost-btn" type="button" id="addActionBtn">添加今日操作</button>
                    </div>
                    <div class="action-list" id="actionList"></div>
                    <div class="panel-actions"><button class="primary-btn" type="button" id="saveDailyBtn">保存每日计划</button></div>
                </div>
            </section>

            <section class="module-panel" id="weeklyPanel">
                <div class="panel-head">
                    <div>
                        <h2>周复盘</h2>
                        <div class="panel-desc">默认显示历史记录，点击新建周复盘后进入编辑。</div>
                    </div>
                    <button class="new-btn" type="button" id="newWeeklyBtn">新建周复盘</button>
                </div>
                <div class="history-list" id="weeklyHistory"></div>
                <div class="editor" id="weeklyEditor">
                    <div class="editor-bar">
                        <div class="editor-title">周复盘编辑</div>
                        <button class="ghost-btn" type="button" id="cancelWeeklyBtn">返回历史</button>
                    </div>
                    <div class="form-grid two">
                        <div class="field"><label for="weekStart">周开始</label><input type="date" id="weekStart"></div>
                        <div class="field"><label for="weekEnd">周结束</label><input type="date" id="weekEnd"></div>
                    </div>
                    <div class="form-grid">
                        <div class="field"><label for="weeklyOperations">本周所有操作</label><textarea id="weeklyOperations"></textarea></div>
                        <div class="field"><label for="weeklyIssues">本周交易问题</label><textarea id="weeklyIssues"></textarea></div>
                        <div class="field"><label for="weeklyNextPlan">下周操作计划</label><textarea id="weeklyNextPlan"></textarea></div>
                        <div class="field"><label for="weeklyImprovements">需要改进的点</label><textarea id="weeklyImprovements"></textarea></div>
                    </div>
                    <div class="panel-actions"><button class="primary-btn" type="button" id="saveWeeklyBtn">保存周复盘</button></div>
                </div>
            </section>

            <section class="module-panel" id="monthlyPanel">
                <div class="panel-head">
                    <div>
                        <h2>月总结</h2>
                        <div class="panel-desc">默认显示历史记录，点击新建月总结后进入编辑。</div>
                    </div>
                    <button class="new-btn" type="button" id="newMonthlyBtn">新建月总结</button>
                </div>
                <div class="history-list" id="monthlyHistory"></div>
                <div class="editor" id="monthlyEditor">
                    <div class="editor-bar">
                        <div class="editor-title">月总结编辑</div>
                        <button class="ghost-btn" type="button" id="cancelMonthlyBtn">返回历史</button>
                    </div>
                    <div class="form-grid">
                        <div class="field"><label for="monthKey">月份</label><input type="month" id="monthKey"></div>
                        <div class="field"><label for="monthlyPerformance">本月表现回顾</label><textarea id="monthlyPerformance"></textarea></div>
                        <div class="field"><label for="winningPatterns">赚钱模式</label><textarea id="winningPatterns"></textarea></div>
                        <div class="field"><label for="losingPatterns">亏钱模式</label><textarea id="losingPatterns"></textarea></div>
                        <div class="field"><label for="experienceSummary">经验总结</label><textarea id="experienceSummary"></textarea></div>
                        <div class="field"><label for="nextMonthGoal">下月目标</label><textarea id="nextMonthGoal"></textarea></div>
                    </div>
                    <div class="panel-actions"><button class="primary-btn" type="button" id="saveMonthlyBtn">保存月总结</button></div>
                </div>
            </section>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='/aquant_web/market'"><div class="nav-icon"><i class="fas fa-chart-area"></i></div><div class="nav-label">市场</div></div>
        <div class="nav-item active" onclick="window.location.href='/aquant_web/review'"><div class="nav-icon"><i class="fas fa-book-open"></i></div><div class="nav-label">复盘</div></div>
        <div class="nav-item" onclick="window.location.href='/aquant_web/choice'"><div class="nav-icon"><i class="fas fa-star"></i></div><div class="nav-label">自选</div></div>
        <div class="nav-item" onclick="window.location.href='/aquant_web/setting'"><div class="nav-icon"><i class="fas fa-cog"></i></div><div class="nav-label">设置</div></div>
    </div>

    <script>
        const actionListEl = document.getElementById('actionList');
        let watchlist = [];

        document.addEventListener('DOMContentLoaded', async function() {
            initTabs();
            bindActions();
            await loadWatchlistOptions();
            await refreshHistories();
            hideAllEditors();
        });

        function initTabs() {
            document.querySelectorAll('.module-tab').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.module-tab').forEach(tab => tab.classList.remove('active'));
                    document.querySelectorAll('.module-panel').forEach(panel => panel.classList.remove('active'));
                    button.classList.add('active');
                    document.getElementById(button.dataset.tab).classList.add('active');
                });
            });
        }

        function bindActions() {
            document.getElementById('newDailyBtn').addEventListener('click', () => openDailyEditorNew());
            document.getElementById('newWeeklyBtn').addEventListener('click', () => openWeeklyEditorNew());
            document.getElementById('newMonthlyBtn').addEventListener('click', () => openMonthlyEditorNew());
            document.getElementById('cancelDailyBtn').addEventListener('click', () => closeEditor('dailyEditor'));
            document.getElementById('cancelWeeklyBtn').addEventListener('click', () => closeEditor('weeklyEditor'));
            document.getElementById('cancelMonthlyBtn').addEventListener('click', () => closeEditor('monthlyEditor'));
            document.getElementById('addActionBtn').addEventListener('click', () => addActionItem());
            document.getElementById('saveDailyBtn').addEventListener('click', saveDailyRecord);
            document.getElementById('saveWeeklyBtn').addEventListener('click', saveWeeklyRecord);
            document.getElementById('saveMonthlyBtn').addEventListener('click', saveMonthlyRecord);
        }

        function hideAllEditors() {
            ['dailyEditor', 'weeklyEditor', 'monthlyEditor'].forEach(id => closeEditor(id));
        }

        function closeEditor(id) {
            document.getElementById(id).classList.remove('show');
        }

        function openEditor(id) {
            document.getElementById(id).classList.add('show');
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            return response.json();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getWeekRange(date) {
            const current = new Date(date);
            const day = current.getDay() || 7;
            current.setDate(current.getDate() - day + 1);
            const start = new Date(current);
            const end = new Date(current);
            end.setDate(start.getDate() + 4);
            return { start: formatDate(start), end: formatDate(end) };
        }

        async function loadWatchlistOptions() {
            try {
                const data = await fetchJson('/aquant_web/api/watchlist');
                watchlist = Array.isArray(data) ? data.map(item => ({ symbol: item.code || '', name: item.name || '' })).filter(item => item.symbol) : [];
            } catch (e) {
                watchlist = [];
            }
        }

        function buildStockOptions(selectedSymbol = '', selectedName = '') {
            const options = ['<option value="">请选择自选股</option>'];
            const exists = watchlist.some(item => item.symbol === selectedSymbol);
            if (selectedSymbol && !exists) {
                options.push(`<option value="${selectedSymbol}" data-name="${selectedName || selectedSymbol}">${selectedSymbol} ${selectedName || ''}（历史）</option>`);
            }
            watchlist.forEach(item => {
                options.push(`<option value="${item.symbol}" data-name="${item.name}">${item.symbol} ${item.name}</option>`);
            });
            return options.join('');
        }

        function createActionItemRow(action = {}) {
            const row = document.createElement('div');
            row.className = 'action-item';
            row.innerHTML = `
                <div class="action-grid">
                    <div class="field">
                        <label>股票（自选）</label>
                        <select class="action-symbol">${buildStockOptions(action.symbol || '', action.name || '')}</select>
                    </div>
                    <div class="field">
                        <label>交易类型</label>
                        <select class="action-type">
                            <option value="">请选择</option>
                            <option value="买入">买入</option>
                            <option value="普通卖出">普通卖出</option>
                            <option value="止损卖出">止损卖出</option>
                            <option value="做T">做T</option>
                        </select>
                    </div>
                </div>
                <div class="field" style="margin-top:10px;">
                    <label>交易逻辑</label>
                    <textarea class="action-logic">${action.logic || ''}</textarea>
                </div>
                <div class="item-actions"><button class="danger-btn" type="button">删除</button></div>
            `;
            const symbolSelect = row.querySelector('.action-symbol');
            const typeSelect = row.querySelector('.action-type');
            symbolSelect.value = action.symbol || '';
            typeSelect.value = action.trade_type || '';
            row.querySelector('.danger-btn').addEventListener('click', () => {
                row.remove();
                if (!actionListEl.children.length) addActionItem();
            });
            return row;
        }

        function addActionItem(action = {}) {
            actionListEl.appendChild(createActionItemRow(action));
        }

        function collectActions() {
            return Array.from(document.querySelectorAll('.action-item')).map((row, index) => {
                const symbolSelect = row.querySelector('.action-symbol');
                const selected = symbolSelect.options[symbolSelect.selectedIndex];
                return {
                    symbol: symbolSelect.value.trim(),
                    name: selected ? (selected.getAttribute('data-name') || '') : '',
                    trade_type: row.querySelector('.action-type').value.trim(),
                    logic: row.querySelector('.action-logic').value.trim(),
                    sort_order: index
                };
            });
        }

        function renderHistory(containerId, items, type) {
            const container = document.getElementById(containerId);
            if (!items.length) {
                container.innerHTML = '<div class="empty-text">暂无历史记录</div>';
                return;
            }
            container.innerHTML = items.map(item => {
                const key = type === 'daily' ? item.trade_date : type === 'weekly' ? item.week_key : item.month_key;
                const sub = type === 'daily'
                    ? `${item.position_pct || '未设仓位'} | ${(item.operation_summary || '').slice(0, 18) || '未填写小结'}`
                    : type === 'weekly'
                        ? `${item.week_start} ~ ${item.week_end}`
                        : `${item.month_key}`;
                return `<div class="history-item"><div class="history-main"><div class="history-title">${key}</div><div class="history-sub">${sub}</div></div><button class="history-link" type="button" onclick="openHistory('${type}','${key}')">查看/编辑</button></div>`;
            }).join('');
        }

        async function refreshHistories() {
            const [daily, weekly, monthly] = await Promise.all([
                fetchJson('/aquant_web/api/review/daily?limit=20'),
                fetchJson('/aquant_web/api/review/weekly?limit=20'),
                fetchJson('/aquant_web/api/review/monthly?limit=20')
            ]);
            renderHistory('dailyHistory', Array.isArray(daily) ? daily : [], 'daily');
            renderHistory('weeklyHistory', Array.isArray(weekly) ? weekly : [], 'weekly');
            renderHistory('monthlyHistory', Array.isArray(monthly) ? monthly : [], 'monthly');
        }

        function openDailyEditorNew() {
            const today = new Date();
            document.getElementById('dailyDate').value = formatDate(today);
            document.getElementById('positionPct').value = '';
            document.getElementById('operationSummary').value = '';
            document.getElementById('tomorrowPlan').value = '';
            document.getElementById('riskWatch').value = '';
            actionListEl.innerHTML = '';
            addActionItem();
            openEditor('dailyEditor');
        }

        function openWeeklyEditorNew() {
            const week = getWeekRange(new Date());
            document.getElementById('weekStart').value = week.start;
            document.getElementById('weekEnd').value = week.end;
            document.getElementById('weeklyOperations').value = '';
            document.getElementById('weeklyIssues').value = '';
            document.getElementById('weeklyNextPlan').value = '';
            document.getElementById('weeklyImprovements').value = '';
            openEditor('weeklyEditor');
        }

        function openMonthlyEditorNew() {
            const today = new Date();
            document.getElementById('monthKey').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('monthlyPerformance').value = '';
            document.getElementById('winningPatterns').value = '';
            document.getElementById('losingPatterns').value = '';
            document.getElementById('experienceSummary').value = '';
            document.getElementById('nextMonthGoal').value = '';
            openEditor('monthlyEditor');
        }

        async function openDailyHistory(tradeDate) {
            const data = await fetchJson(`/aquant_web/api/review/daily/${tradeDate}`);
            document.getElementById('dailyDate').value = data.trade_date || tradeDate;
            document.getElementById('positionPct').value = data.position_pct || '';
            document.getElementById('operationSummary').value = data.operation_summary || '';
            document.getElementById('tomorrowPlan').value = data.tomorrow_plan || '';
            document.getElementById('riskWatch').value = data.risk_watch || '';
            actionListEl.innerHTML = '';
            const actions = data.actions || data.items || [];
            if (actions.length) actions.forEach(item => addActionItem(item));
            else addActionItem();
            openEditor('dailyEditor');
        }

        async function openWeeklyHistory(weekKey) {
            const data = await fetchJson(`/aquant_web/api/review/weekly/${weekKey}`);
            document.getElementById('weekStart').value = data.week_start || '';
            document.getElementById('weekEnd').value = data.week_end || '';
            document.getElementById('weeklyOperations').value = data.operation_review || '';
            document.getElementById('weeklyIssues').value = data.trade_issues || '';
            document.getElementById('weeklyNextPlan').value = data.next_week_plan || '';
            document.getElementById('weeklyImprovements').value = data.improvements || '';
            openEditor('weeklyEditor');
        }

        async function openMonthlyHistory(monthKey) {
            const data = await fetchJson(`/aquant_web/api/review/monthly/${monthKey}`);
            document.getElementById('monthKey').value = data.month_key || monthKey;
            document.getElementById('monthlyPerformance').value = data.performance_review || '';
            document.getElementById('winningPatterns').value = data.winning_patterns || '';
            document.getElementById('losingPatterns').value = data.losing_patterns || '';
            document.getElementById('experienceSummary').value = data.experience_summary || '';
            document.getElementById('nextMonthGoal').value = data.next_month_goal || '';
            openEditor('monthlyEditor');
        }

        window.openHistory = async function(type, key) {
            if (type === 'daily') {
                document.querySelector('[data-tab="dailyPanel"]').click();
                await openDailyHistory(key);
                return;
            }
            if (type === 'weekly') {
                document.querySelector('[data-tab="weeklyPanel"]').click();
                await openWeeklyHistory(key);
                return;
            }
            document.querySelector('[data-tab="monthlyPanel"]').click();
            await openMonthlyHistory(key);
        };

        async function saveDailyRecord() {
            const payload = {
                trade_date: document.getElementById('dailyDate').value,
                position_pct: document.getElementById('positionPct').value,
                operation_summary: document.getElementById('operationSummary').value.trim(),
                tomorrow_plan: document.getElementById('tomorrowPlan').value.trim(),
                risk_watch: document.getElementById('riskWatch').value.trim(),
                actions: collectActions()
            };
            const response = await fetch('/aquant_web/api/review/daily', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) { showToast('每日计划保存失败'); return; }
            showToast('每日计划已保存');
            closeEditor('dailyEditor');
            await refreshHistories();
        }

        async function saveWeeklyRecord() {
            const weekStart = document.getElementById('weekStart').value;
            const weekEnd = document.getElementById('weekEnd').value;
            const payload = {
                week_key: `${weekStart}_${weekEnd}`,
                week_start: weekStart,
                week_end: weekEnd,
                operation_review: document.getElementById('weeklyOperations').value.trim(),
                trade_issues: document.getElementById('weeklyIssues').value.trim(),
                next_week_plan: document.getElementById('weeklyNextPlan').value.trim(),
                improvements: document.getElementById('weeklyImprovements').value.trim()
            };
            const response = await fetch('/aquant_web/api/review/weekly', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) { showToast('周复盘保存失败'); return; }
            showToast('周复盘已保存');
            closeEditor('weeklyEditor');
            await refreshHistories();
        }

        async function saveMonthlyRecord() {
            const payload = {
                month_key: document.getElementById('monthKey').value,
                performance_review: document.getElementById('monthlyPerformance').value.trim(),
                winning_patterns: document.getElementById('winningPatterns').value.trim(),
                losing_patterns: document.getElementById('losingPatterns').value.trim(),
                experience_summary: document.getElementById('experienceSummary').value.trim(),
                next_month_goal: document.getElementById('nextMonthGoal').value.trim()
            };
            const response = await fetch('/aquant_web/api/review/monthly', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) { showToast('月总结保存失败'); return; }
            showToast('月总结已保存');
            closeEditor('monthlyEditor');
            await refreshHistories();
        }
    </script>
</body>
</html>
